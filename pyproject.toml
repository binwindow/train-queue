[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-queue-lite"
version = "0.1.0"
description = "A lightweight foreground GPU queue for tmux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tq = "tq:main"

[tool.setuptools]
py-modules = ["tq"]
